spring.cloud.compatibility-verifier.enabled=false
spring.application.name=config-server
server.port=9101

# Configuration du dépôt Git pour Spring Cloud Config :
# 1) Option Locale (fonctionne directement sans compte GitHub et hors ligne) :
spring.cloud.config.server.git.uri=file:///${user.home}/Desktop/Jee/config-server-repo

# 2) Option GitHub distante (comme décrit dans le sujet du TP page 15-17) :
# Pour l'activer, commentez la ligne ci-dessus et décommentez les lignes suivantes en remplaçant par votre dépôt GitHub :
# spring.cloud.config.server.git.uri=https://github.com/<votre-pseudo-github>/mcommerce-config-repo.git
# spring.cloud.config.server.git.username=<votre-username-github>
# spring.cloud.config.server.git.password=<votre-personal-access-token-github>

spring.cloud.config.server.git.default-label=master

# Log level configuration
logging.level.root=INFO
logging.level.com.mcommerce.config.server=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
